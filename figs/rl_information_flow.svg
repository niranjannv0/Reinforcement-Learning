<svg viewBox="0 0 820 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive">
  <rect width="820" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="50" text-anchor="middle" font-size="34" fill="#1a1a1a" font-weight="bold">Reinforcement Learning Information Flow</text>

  <!-- Outer loop arrow (grey), output box back to state box -->
  <path d="M770 790 C 815 790 815 970 770 970 L 90 970 C 40 970 40 265 58 265"
        fill="none" stroke="#bdbdbd" stroke-width="6" stroke-linecap="round"/>
  <polygon points="58,265 44,250 44,280" fill="#bdbdbd"/>

  <!-- ============ BAND A: ACT ============ -->
  <rect x="60" y="195" width="130" height="140" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="125" y="258" text-anchor="middle" font-size="26" fill="#1565c0">S<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  <text x="125" y="305" text-anchor="middle" font-size="19" fill="#1565c0">state</text>

  <text x="330" y="118" text-anchor="middle" font-size="26" fill="#111">&#960;</text>
  <text x="330" y="140" text-anchor="middle" font-size="16" fill="#111">policy</text>
  <path d="M330 148 L330 214" stroke="#111" stroke-width="2.5" marker-end="url(#arrowBlack)"/>

  <text x="450" y="108" text-anchor="middle" font-size="24" fill="#e65100">&#949;</text>
  <text x="450" y="130" text-anchor="middle" font-size="16" fill="#e65100">explore</text>
  <path d="M440 138 Q400 180 358 225" stroke="#e65100" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>

  <circle cx="330" cy="265" r="48" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="330" y="272" text-anchor="middle" font-size="20" fill="#111">act</text>

  <line x1="190" y1="265" x2="282" y2="265" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="378" y1="265" x2="628" y2="265" stroke="#c2185b" stroke-width="3" marker-end="url(#arrowPink)"/>

  <rect x="630" y="195" width="130" height="140" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="695" y="258" text-anchor="middle" font-size="26" fill="#c2185b">A<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  <text x="695" y="305" text-anchor="middle" font-size="19" fill="#c2185b">action</text>

  <text x="410" y="360" text-anchor="middle" font-size="23" fill="#333" font-weight="bold">agent chooses action</text>

  <!-- ============ BAND B: ENVIRONMENT ============ -->
  <rect x="60" y="455" width="130" height="140" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="125" y="518" text-anchor="middle" font-size="24" fill="#c2185b">A<tspan baseline-shift="sub" font-size="15">t</tspan></text>
  <text x="125" y="565" text-anchor="middle" font-size="19" fill="#c2185b">action</text>

  <text x="330" y="410" text-anchor="middle" font-size="22" fill="#00897b">dynamics</text>
  <path d="M330 418 L330 477" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <circle cx="330" cy="525" r="48" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="330" y="518" text-anchor="middle" font-size="16" fill="#111">environ-</text>
  <text x="330" y="537" text-anchor="middle" font-size="16" fill="#111">ment</text>

  <line x1="190" y1="525" x2="282" y2="525" stroke="#c2185b" stroke-width="3" marker-end="url(#arrowPink)"/>
  <line x1="378" y1="507" x2="628" y2="480" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="378" y1="543" x2="628" y2="570" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="630" y="440" width="130" height="80" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="695" y="488" text-anchor="middle" font-size="22" fill="#1565c0">S<tspan baseline-shift="sub" font-size="14">t+1</tspan></text>

  <rect x="630" y="530" width="130" height="80" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="695" y="578" text-anchor="middle" font-size="22" fill="#2e7d32">R<tspan baseline-shift="sub" font-size="14">t+1</tspan></text>

  <text x="410" y="618" text-anchor="middle" font-size="23" fill="#333" font-weight="bold">environment responds</text>

  <!-- ============ BAND C: LEARN ============ -->
  <rect x="60" y="720" width="130" height="140" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="125" y="783" text-anchor="middle" font-size="19" fill="#333">S,A,R,S'</text>
  <text x="125" y="823" text-anchor="middle" font-size="19" fill="#333">transition</text>

  <!-- value / critic box (new) -->
  <rect x="268" y="645" width="124" height="46" fill="none" stroke="#3949ab" stroke-width="2.5" rx="4"/>
  <text x="330" y="674" text-anchor="middle" font-size="16" fill="#3949ab">V(s), V(s')</text>
  <path d="M330 691 L330 742" stroke="#3949ab" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>

  <text x="205" y="655" text-anchor="middle" font-size="18" fill="#8e24aa">&#947; discount</text>
  <path d="M225 665 Q265 705 300 745" stroke="#8e24aa" stroke-width="2.5" fill="none" marker-end="url(#arrowPurple)"/>

  <text x="470" y="655" text-anchor="middle" font-size="18" fill="#e65100">&#945; learning rate</text>
  <path d="M470 665 L470 742" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <circle cx="330" cy="790" r="48" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="330" y="784" text-anchor="middle" font-size="15" fill="#111">TD error</text>
  <text x="330" y="803" text-anchor="middle" font-size="18" fill="#111">&#948;</text>

  <circle cx="470" cy="790" r="48" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="470" y="784" text-anchor="middle" font-size="15" fill="#111">update</text>
  <text x="470" y="803" text-anchor="middle" font-size="14" fill="#111">Q, V, &#960;</text>

  <line x1="190" y1="790" x2="282" y2="790" stroke="#333" stroke-width="3" marker-end="url(#arrowBlack)"/>
  <line x1="378" y1="790" x2="422" y2="790" stroke="#111" stroke-width="3" marker-end="url(#arrowBlack)"/>
  <line x1="518" y1="790" x2="628" y2="790" stroke="#111" stroke-width="3" marker-end="url(#arrowBlack)"/>

  <rect x="630" y="705" width="130" height="170" fill="none" stroke="#111" stroke-width="3" rx="4"/>
  <text x="695" y="750" text-anchor="middle" font-size="21" fill="#111">Q'(s,a)</text>
  <text x="695" y="785" text-anchor="middle" font-size="21" fill="#3949ab">V'(s)</text>
  <text x="695" y="822" text-anchor="middle" font-size="18" fill="#333">policy &#960;'</text>

  <text x="410" y="915" text-anchor="middle" font-size="23" fill="#333" font-weight="bold">agent learns from experience</text>
  <text x="410" y="942" text-anchor="middle" font-size="18" fill="#555" font-style="italic">&#948; = R + &#947;&#183;V(s') &#8722; V(s)</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c2185b"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00897b"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8e24aa"/></marker>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3949ab"/></marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111"/></marker>
  </defs>

  <text x="750" y="990" text-anchor="end" font-size="14" fill="#aaa" font-style="italic">original diagram</text>
</svg>
