name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile python/q_learning_gridworld.py

      # No display on the CI runner, so this trains a small number of
      # episodes with matplotlib's Agg backend and saves a PNG instead
      # of opening a GUI window.
      - name: Smoke test (headless)
        run: python python/q_learning_gridworld.py --headless --episodes 50
