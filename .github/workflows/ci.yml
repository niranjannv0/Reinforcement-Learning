name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile python/value_iteration_gridworld.py
          python -m py_compile python/policy_iteration_gridworld.py
          python -m py_compile python/q_learning_gridworld.py
          python -m py_compile python/sarsa_gridworld.py
          python -m py_compile python/cross_entropy_method.py

      # No display on the CI runner, so each demo runs briefly with
      # matplotlib's Agg backend and saves a PNG instead of opening a
      # GUI window. Episode/generation counts are kept small here purely
      # for CI speed -- they're not meant to reflect real convergence.
      # Value/Policy Iteration have no such knob to shrink -- they just
      # run to their own convergence threshold, which is fast on a 4x3 grid.
      - name: Smoke test — Value Iteration (headless)
        run: python python/value_iteration_gridworld.py --headless

      - name: Smoke test — Policy Iteration (headless)
        run: python python/policy_iteration_gridworld.py --headless

      - name: Smoke test — Q-learning (headless)
        run: python python/q_learning_gridworld.py --headless --episodes 50

      - name: Smoke test — SARSA (headless)
        run: python python/sarsa_gridworld.py --headless --episodes 50

      - name: Smoke test — Cross-Entropy Method (headless)
        run: python python/cross_entropy_method.py --headless --generations 5 --population 10 --episodes 2